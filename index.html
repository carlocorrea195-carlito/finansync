                                            <label className="text-slate-400 block mb-1">RUC</label>
                                            <input type="text" placeholder="20601234567" value={entityForm.ruc} onChange={e => setEntityForm({ ...entityForm, ruc: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-lg" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-slate-400 block mb-1">Razón social</label>
                                        <input type="text" placeholder="(opcional)" value={entityForm.reason} onChange={e => setEntityForm({ ...entityForm, reason: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-lg" />
                                    </div>
                                    <div>
                                        <label className="text-slate-400 block mb-1">Enlace de carpeta de Drive</label>
                                        <input type="url" placeholder="https://drive.google.com/drive/folders/..." value={entityForm.driveFolderUrl} onChange={e => setEntityForm({ ...entityForm, driveFolderUrl: e.target.value })} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-lg font-mono" />
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <input type="checkbox" id="newSync" checked={entityForm.syncEnabled} onChange={e => setEntityForm({ ...entityForm, syncEnabled: e.target.checked })} className="w-4 h-4 accent-emerald-500" />
                                        <label htmlFor="newSync" className="cursor-pointer">Activar sincronización con Drive</label>
                                    </div>
                                    {editingEntityId && entityForm.name.trim() !== entities.find(e => e.id === editingEntityId)?.name && (
                                        <p className="text-[11px] text-amber-400 bg-amber-950/40 border border-amber-900/40 px-2 py-1 rounded">ℹ️ Al cambiar el nombre, las transacciones y listas maestras se migrarán al nuevo nombre.</p>
                                    )}
                                    {entityFormError && <p className="text-rose-400 bg-rose-950/40 border border-rose-900/40 px-2 py-1.5 rounded text-[11px]">⚠️ {entityFormError}</p>}
                                    <p className="text-[10px] text-slate-500">Archivos esperados en Drive: <code className="text-slate-300">registro_ventas_{entityForm.code || 'XX'}</code> y <code className="text-slate-300">registro_compras_{entityForm.code || 'XX'}</code></p>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowEntityModal(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl transition">Cancelar</button>
                                        <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition">{editingEntityId ? 'Guardar Cambios' : 'Guardar Empresa'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <nav className="bg-slate-900 border-t border-slate-800 fixed bottom-0 left-0 right-0 z-40 flex justify-around p-2 text-xs font-medium">
                        {[
                            { key: 'resumen', icon: '📊', label: 'Resumen' },
                            { key: 'indicadores', icon: '📈', label: 'Indicadores' },
                            { key: 'eeff', icon: '📑', label: 'EEFF' },
                            { key: 'historial', icon: '📝', label: 'Historial' },
                            { key: 'entidades', icon: '🏢', label: 'Entidades' },
                            { key: 'config', icon: '⚙️', label: 'Ajustes' }
                        ].map(item => (
                            <button key={item.key} onClick={() => setTab(item.key)} className={`flex flex-col items-center p-2 rounded-lg ${tab === item.key ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
                                {item.icon} <span>{item.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registrado:', reg))
            .catch(err => console.warn('Error al registrar SW:', err));
        });
      }
    </script>
</body>
</html>
